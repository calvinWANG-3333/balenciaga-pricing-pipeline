name: balenciaga_pricing
version: "1.0.0"
config-version: 2

# dbt platform ignores this name (it uses the connection you configured); local runs use profiles.yml
profile: default

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# before every dbt command: make sure the delivery gate's audit tables exist (see macros/ops_tables.sql)
on-run-start:
  - "{{ create_ops_tables() }}"

clean-targets:
  - "target"
  - "dbt_packages"

# dbt-project-evaluator (best-practice checks on the DAG itself) overrides a few dbt macros so it can
# run on Databricks/Spark. It only RUNS in CI (see the enabled flags at the bottom of this file).
dispatch:
  - macro_namespace: dbt
    search_order: ["dbt_project_evaluator", "dbt"]

# --------------------------------------------------------------------------------------------------
# Business configuration that the SQL reads. Kept here (version-controlled, reviewed in PRs) rather
# than hard-coded inside models, so changing a rule never means hunting through SQL.
# --------------------------------------------------------------------------------------------------
vars:
  brand_slug: Balenciaga

  # which currency each market's website is expected to show
  market_currency:
    ARE: AED
    AUS: AUD
    CAN: CAD
    CHN: CNY
    FRA: EUR
    GBR: GBP
    HKG: HKD
    JPN: JPY
    KOR: KRW
    MEX: MXN
    MYS: MYR
    SAU: SAR
    SGP: SGD
    THA: THB
    TWN: TWD
    USA: USD

  # ISO 4217 minor units ("how many decimals the currency has"). Anything not listed has 2.
  # 3-decimal currencies (KWD, BHD ...) make "1.250" genuinely ambiguous -> quarantined.
  currency_minor_units:
    JPY: 0
    KRW: 0
    KWD: 3
    BHD: 3

  # crawl scopes: weekly crawls cover these markets, extended (monthly) crawls cover all 16
  weekly_markets: [ARE, CHN, FRA, GBR, HKG, JPN, KOR, USA]

  # a market whose row count falls below this share of its usual count is a partial crawl
  partial_crawl_threshold: 0.70
  # a file whose newest crawl timestamp is older than its file-name date by more than this is stale
  stale_file_tolerance_days: 3

  # every data-quality reason the staging layer can emit, and what must happen to the row
  #   fix        deterministic repair, raw value kept next to the repaired one
  #   warn       row kept, issue surfaced
  #   quarantine row excluded from marts, surfaced in qa_raw__quarantined_lines
  dq_reasons:
    price_us_thousands_separator: fix
    price_eu_decimal_format: fix
    price_currency_symbol: fix
    price_trailing_decimals: fix
    price_non_ascii_digits: fix
    price_dot_thousands_ambiguous: fix
    price_numeric_type_drift: fix
    price_ambiguous_separator: quarantine
    price_on_request: quarantine
    price_from_or_range: quarantine
    price_placeholder: quarantine
    price_unparseable: quarantine
    missing_price_value: fix
    currency_code_notation: fix
    currency_market_mismatch: quarantine
    name_html_entity: fix
    name_whitespace_noise: fix
    name_case_drift: fix
    name_missing: quarantine
    category_mojibake: fix
    sku_format_variant: fix
    sku_recovered_from_object_id: fix
    market_recovered_from_source: fix
    timestamp_epoch_seconds: fix
    is_valid_as_string: fix
    url_missing: warn
    preview_url_missing: warn
    exact_duplicate_line: fix
    conflicting_duplicate: quarantine
    non_product_page: quarantine
    http_error_or_invalid: quarantine
    is_valid_contradiction: quarantine
    # emitted by the intermediate layer (needs price history), not by staging
    price_scale_outlier: quarantine

  # ------------------------------------------------------------------------------------------------
  # dbt-project-evaluator: the project's own conventions, so the checks judge us by our rules.
  #   marts      fct_/dim_ = the shared star schema; mart_ = a client deliverable at report grain
  #   published  pub_ = the released, public interface (write-audit-publish)
  #   quality    qa_ = the QA lane, which reads staging on purpose to see what the marts filter out
  # ------------------------------------------------------------------------------------------------
  dbt_project_evaluator:
    model_types: ["base", "staging", "intermediate", "marts", "published", "quality", "other"]
    marts_prefixes: ["fct_", "dim_", "mart_"]
    published_folder_name: "published"
    published_prefixes: ["pub_"]
    quality_folder_name: "quality"
    quality_prefixes: ["qa_"]

# --------------------------------------------------------------------------------------------------
# Materialization + schema per layer (directory-based config). Override per model only with a
# written reason in that model's config block.
# --------------------------------------------------------------------------------------------------
models:
  balenciaga_pricing:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
    quality:
      +materialized: table
      +schema: quality
    published:
      +materialized: view
      +schema: published
      # the public interface of the project: BI, the metrics agent and the exposures read only these.
      # Public => contract enforced (names + types checked at build) and every column documented.
      +access: public
      +contract:
        enforced: true
    semantic:
      +materialized: table
      +schema: semantic
  # best-practice checks: built only when DBT_PROJECT_EVALUATOR_ENABLED=true (the CI job), never in
  # Studio or production, so they cost nothing outside a pull request
  dbt_project_evaluator:
    +enabled: "{{ (env_var('DBT_PROJECT_EVALUATOR_ENABLED', 'false') | lower == 'true') | as_bool }}"
    +schema: project_evaluator
    marts:
      structure:
        # one properties file per LAYER (models/intermediate/_intermediate__models.yml ...) instead of one
        # per folder: a deliberate choice for a 37-model project, so tests sit next to their layer, not
        # next to each folder. Every other structure rule stays on.
        fct_test_directories:
          +enabled: false

seeds:
  balenciaga_pricing:
    +schema: seeds
    # our documented exceptions to the evaluator's rules (seeds/dbt_project_evaluator_exceptions.csv)
    dbt_project_evaluator_exceptions:
      +enabled: "{{ (env_var('DBT_PROJECT_EVALUATOR_ENABLED', 'false') | lower == 'true') | as_bool }}"
      +schema: project_evaluator
  dbt_project_evaluator:
    +enabled: "{{ (env_var('DBT_PROJECT_EVALUATOR_ENABLED', 'false') | lower == 'true') | as_bool }}"
    +schema: project_evaluator
    # replaced by ours
    dbt_project_evaluator_exceptions:
      +enabled: false

data_tests:
  balenciaga_pricing:
    +severity: error
  dbt_project_evaluator:
    +enabled: "{{ (env_var('DBT_PROJECT_EVALUATOR_ENABLED', 'false') | lower == 'true') | as_bool }}"
    +severity: "{{ env_var('DBT_PROJECT_EVALUATOR_SEVERITY', 'warn') }}"
