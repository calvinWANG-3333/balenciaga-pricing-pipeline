version: 2

# The published layer: what BI and the metrics agent are allowed to read. Each view is a mart filtered to
# deliveries the delivery gate has released (write-audit-publish). Views, so a release is visible at once.
#
# This is the PUBLIC interface of the project (access: public, set in dbt_project.yml), so every view has
#   - an enforced contract: column names and types are checked at build time; a breaking change fails
#     the build here instead of breaking a dashboard
#   - every column documented (doc blocks in models/docs/public_columns.md, shared with the marts)
#   - its primary key tested where consumers read it, not only upstream

models:
  - name: pub_released_deliveries
    description: >
      Grain - one row per released delivery (scope, as_of_date). The publish switch: every other published view keeps only the deliveries listed here.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [scope, as_of_date]
    columns:
      - name: scope
        data_type: string
        description: "{{ doc('col_scope') }}"
        data_tests:
          - accepted_values:
              arguments: {values: [micro, macro]}
      - name: as_of_date
        data_type: date
        description: "{{ doc('col_as_of_date') }}"
      - name: decision
        data_type: string
        description: "{{ doc('col_decision') }}"
      - name: is_forced
        data_type: boolean
        description: "{{ doc('col_is_forced') }}"
      - name: first_released_at
        data_type: timestamp
        description: "{{ doc('col_first_released_at') }}"

  - name: pub_micro__hero_prices_weekly
