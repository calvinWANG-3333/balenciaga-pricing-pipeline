version: 2

# Exposures declare who CONSUMES the data. Consumers read the published layer (released deliveries only,
# see models/published). They appear in the lineage graph as the final nodes, so a
# change to an upstream model shows which dashboards and tools it can break (`dbt ls -s +exposure:...`).

exposures:

  # One exposure per BI page (bi/src/*.md, Phase 6c). depends_on lists exactly the models the page reads
  # through the snapshot, so `dbt ls -s +exposure:<name>` is the page's real blast radius.

  - name: micro_hero_price_tracker
    label: Micro - Hero price tracker
    type: dashboard
    maturity: medium
    url: https://calvinwang-3333.github.io/balenciaga-pricing-pipeline/bi/micro
    description: >
      Weekly (Tuesday) grid of the 8 hero products x 8 weekly markets: price status in every cell (increase,
      decrease, unchanged, first delivery, not found, page error), stale and carried-forward flags, and each
      hero's trend indexed to 100 per market. BI page bi/src/micro.md.
    owner: {name: Calvin Wang}
    depends_on:
      - ref('pub_micro__hero_prices_weekly')
      - ref('pub_dim_market')

  - name: macro_category_monitor
    label: Macro - Category monitor
    type: dashboard
    maturity: medium
    url: https://calvinwang-3333.github.io/balenciaga-pricing-pipeline/bi/macro
    description: >
      Monthly like-for-like change per macro category and market, the global headline market-weighted and
      product-weighted side by side, and price levels (min / median / mean / max) in local currency.
      BI page bi/src/macro.md.
    owner: {name: Calvin Wang}
    depends_on:
      - ref('pub_macro__category_monthly')
      - ref('pub_macro__category_monthly_global')
      - ref('pub_dim_market')

  - name: price_change_explorer
    label: Price changes - event explorer
    type: dashboard
    maturity: medium
    url: https://calvinwang-3333.github.io/balenciaga-pricing-pipeline/bi/price-changes
    description: >
      Every price change event up to the latest released delivery: increases and decreases per crawl, the
      size distribution per category, and the latest events by product. BI page bi/src/price-changes.md.
    owner: {name: Calvin Wang}
    depends_on:
      - ref('pub_fct_price_changes')
      - ref('pub_dim_product')
      - ref('pub_dim_market')

  - name: incident_replay_report
    label: Incident replay - legacy vs point-in-time
    type: analysis
    maturity: high
    url: https://calvinwang-3333.github.io/balenciaga-pricing-pipeline/bi/incident
    description: >
      Replay of the shared-catalogue design against the point-in-time design: which date x market cells the
      old design got wrong, the file that caused it, and the delivery gate's verdict on both designs.
      BI page bi/src/incident.md.
    owner: {name: Calvin Wang}
    depends_on:
      - ref('qa_incident__legacy_vs_point_in_time')
      - ref('mart_data_health__deliveries')
      - ref('pub_dim_market')

  - name: data_health_page
    label: Data health - delivery gate verdicts
    type: dashboard
    maturity: medium
    url: https://calvinwang-3333.github.io/balenciaga-pricing-pipeline/bi/data-health
    description: >
      Every delivery's gate verdict (PASS / WARN / BLOCK) and whether it was released, every check's result
      behind it (observed value, rules, message), on the published design and on the replay of the old
      design. BI page bi/src/data-health.md.
    owner: {name: Calvin Wang}
    depends_on:
      - ref('mart_data_health__deliveries')
      - ref('mart_data_health__check_results')

  - name: metrics_agent
    label: Metrics Q&A agent
    type: application
    maturity: low
    description: >
      Natural-language Q&A over governed metrics (Phase 5). Reads only the published layer, through the
      metrics defined in the dbt semantic layer.
    owner: {name: Calvin Wang}
    depends_on:
      - ref('pub_fct_price_changes')
      - ref('pub_fct_catalogue_as_of')
      - ref('pub_micro__hero_prices_weekly')
      - ref('pub_macro__category_monthly')
      - ref('pub_macro__category_monthly_global')
